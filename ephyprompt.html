<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EphyPrompt</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <aside class="sidebar">
    <div class="banner">
      EphyPrompt<br />
      such private, very security, wow
    </div>

    <label class="field">
      <span>Model</span>
      <select id="model"></select>
    </label>

    <label class="checkbox">
      <input type="checkbox" id="thinking" checked />
      <span>Thinking</span>
    </label>

    <label class="field">
      <span>Images (allows selecting multiple)</span>
      <input type="file" id="image" accept="image/*" multiple />
      <div id="image-selection" class="image-selection-list" hidden></div>
    </label>

    <label class="field">
      <span>PDF (rasterized and attached as images)</span>
      <input type="file" id="pdf" accept="application/pdf" />
      <div id="pdf-status" class="image-selection-list pdf-status" hidden></div>
    </label>

    <label class="field">
      <span>PDF rasterization DPI</span>
      <select id="pdf-dpi">
        <option value="72">72 (default, small)</option>
        <option value="100">100</option>
        <option value="150">150 (medium)</option>
        <option value="200">200</option>
        <option value="300">300 (high)</option>
      </select>
    </label>
  </aside>

  <main class="chat">
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="composer" class="composer">
      <textarea id="input" placeholder="Was geht bei dir so, digga?">Was geht bei dir so, digga?</textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <script>
    const MODEL_OPTIONS = [
      { id: "deepseek/deepseek-v4-flash-0731", label: "DeepSeek V4 Flash (günstig)", supportsImages: false },
      { id: "openai/gpt-oss-120b", label: "OpenAI GPT-OSS 120B (sehr günstig)", supportsImages: false },
      { id: "deepseek/deepseek-v4-pro", label: "DeepSeek V4 Pro", supportsImages: false },
      { id: "z-ai/glm-5.2", label: "Z-AI GLM-5.2", supportsImages: false },
      { id: "z-ai/glm-5v-turbo", label: "Z-AI GLM-5v Turbo (bilder)", supportsImages: true },
      { id: "minimax/minimax-m3", label: "Minimax M3 (bilder)", supportsImages: true },
      { id: "moonshotai/kimi-k2.6", label: "Moonshot kimi K2.6 (bilder)", supportsImages: true },
      { id: "moonshotai/kimi-k3", label: "Moonshot kimi K3 (bilder, teuer!!)", supportsImages: true },
      { id: "qwen/qwen3.5-122b-a10b", label: "Qwen 3.5 (bilder)", supportsImages: true }
    ];

    const elements = {
      model: document.getElementById("model"),
      thinking: document.getElementById("thinking"),
      image: document.getElementById("image"),
      imageSelection: document.getElementById("image-selection"),
      pdf: document.getElementById("pdf"),
      pdfStatus: document.getElementById("pdf-status"),
      pdfDpi: document.getElementById("pdf-dpi"),
      messages: document.getElementById("messages"),
      composer: document.getElementById("composer"),
      input: document.getElementById("input"),
      send: document.getElementById("send")
    };

    let messages = [];
    let activeRequest = null;

    function populateModelOptions() {
      elements.model.replaceChildren();
      for (const model of MODEL_OPTIONS) {
        const option = document.createElement("option");
        option.value = model.id;
        option.textContent = model.label;
        elements.model.appendChild(option);
      }
      elements.model.value = MODEL_OPTIONS[0].id;
      updateImageControls();
    }

    function updateImageControls() {
      const model = MODEL_OPTIONS.find((entry) => entry.id === elements.model.value);
      const supportsImages = Boolean(model?.supportsImages);
      elements.image.disabled = !supportsImages;
      elements.image.style.opacity = supportsImages ? "1" : "0.5";
      elements.image.title = supportsImages
        ? "Attach one or more images"
        : "Image uploads are not available for the selected model";
      elements.pdf.disabled = !supportsImages;
      elements.pdf.style.opacity = supportsImages ? "1" : "0.5";
      elements.pdf.title = supportsImages
        ? "Upload a PDF; each page will be rasterized to a JPG on the proxy"
        : "Image uploads are not available for the selected model";
    }

    function createBubble(role) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;

      const label = document.createElement("div");
      label.className = "bubble-label";
      label.textContent = role.toUpperCase();

      bubble.appendChild(label);
      return bubble;
    }

    function createUserBubble(content) {
      const bubble = createBubble("user");
      const body = document.createElement("div");

      for (const item of content) {
        if (item.type === "text") {
          const text = document.createElement("div");
          text.textContent = item.text;
          body.appendChild(text);
        }

        if (item.type === "image_url") {
          const link = imagePreviewLink(item.image_url.url, "🖼️ View image", "right")
          body.appendChild(link);
        }
      }

      bubble.appendChild(body);
      elements.messages.appendChild(bubble);
      bubble.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    // browsers don't like navigating to data URLs, so also show the image in-place.
    function imagePreviewLink(dataUrlImage, text, imagePopupSide) {
      const link = document.createElement("a");
      link.href = dataUrlImage;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.className = "attachment-chip";
      link.textContent = text;

      const img = document.createElement("img");
      img.src = dataUrlImage;
      img.style.display = "none";
      img.style.position = "absolute";
      img.style.top = "100%";
      img.style[imagePopupSide] = "0";
      img.style.zIndex = "1000";
      link.style.position = "relative";

      link.appendChild(img);
      link.addEventListener("mouseenter", () => {
        img.style.display = "block";
      });
      link.addEventListener("mouseleave", () => {
        img.style.display = "none";
      });
      return link;
    }

    async function copyToClipboard(text, button) {
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "✓";
        setTimeout(() => { button.textContent = "📋"; }, 1200);
      } catch (error) {
        console.error("Copy failed:", error);
        button.textContent = "❌";
      }
    }

    function createAssistantBubble() {
      const bubble = createBubble("assistant");

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "📋";
      copyBtn.title = "Copy response";
      copyBtn.setAttribute("aria-label", "Copy response");

      const thinking = document.createElement("div");
      thinking.className = "thinking";

      const status = document.createElement("div");
      status.className = "assistant-status visible";
      status.innerHTML = '<span class="dot"></span><span>Thinking…</span>';

      const content = document.createElement("div");

      copyBtn.addEventListener("click", () => copyToClipboard(content.textContent, copyBtn));

      bubble.append(copyBtn, thinking, status, content);
      elements.messages.appendChild(bubble);
      bubble.scrollIntoView({ behavior: "smooth", block: "end" });

      return { bubble, copyBtn, thinking, content, status };
    }


    function updateAssistantBubble(assistantBubble, { content, thinking, loading }) {
      assistantBubble.thinking.textContent = thinking;
      assistantBubble.thinking.classList.toggle("visible", Boolean(thinking));

      assistantBubble.content.textContent = content;

      assistantBubble.status.classList.toggle("visible", loading);
      assistantBubble.status.innerHTML = loading ? '<span class="dot"></span><span>Thinking…</span>' : '';

      const hasContent = content && String(content).trim().length > 0;
      assistantBubble.copyBtn.classList.toggle("visible", hasContent);

      assistantBubble.bubble.scrollIntoView({ behavior: "auto", block: "end" });
    }

    async function updateImageSelectionSummary() {
      const files = Array.from(elements.image.files || []);
      if (files.length === 0) {
        elements.imageSelection.textContent = "No images selected";
        elements.imageSelection.hidden = true;
        return;
      }

      elements.imageSelection.hidden = false;
      elements.imageSelection.replaceChildren();

      const dataUrls = await Promise.all(files.map(fileToBase64));
      dataUrls.forEach((dataUrl, index) => {
        if (index > 0) {
          elements.imageSelection.appendChild(document.createTextNode(", "));
        }
        elements.imageSelection.appendChild(imagePreviewLink(dataUrl, `🖼️ ${files[index].name}`, "left"));
      });
    }

    function clearSelectedImages() {
      elements.image.value = "";
      updateImageSelectionSummary();
    }

    function setPdfStatus(text, loading = false) {
      if (!text) {
        elements.pdfStatus.hidden = true;
        elements.pdfStatus.innerHTML = "";
        return;
      }
      elements.pdfStatus.hidden = false;
      if (loading) {
        elements.pdfStatus.innerHTML = `<span class="dot"></span><span>${text}</span>`;
      } else {
        elements.pdfStatus.textContent = text;
      }
    }

    function base64ToFile(b64, name, mimeType) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new File([bytes], name, { type: mimeType });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function appendFilesToImageInput(files) {
      const dt = new DataTransfer();
      for (const existing of Array.from(elements.image.files || [])) {
        dt.items.add(existing);
      }
      for (const file of files) {
        dt.items.add(file);
      }
      elements.image.files = dt.files;
      await updateImageSelectionSummary();
    }

    async function handlePdfSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const modelConfig = MODEL_OPTIONS.find((entry) => entry.id === elements.model.value);
      if (!modelConfig?.supportsImages) {
        alert("The selected model does not support image uploads.");
        elements.pdf.value = "";
        return;
      }

      setPdfStatus(`Rasterizing ${file.name}…`, true);
      elements.pdf.disabled = true;
      elements.send.disabled = true;

      try {
        const dpi = parseInt(elements.pdfDpi.value, 10) || 72;
        console.log("[ephyprompt]", "PDF rasterization request. DPI: ", dpi, "X-Filename: ", file.name);
        const response = await fetch("/rasterize-pdf", {
          method: "POST",
          headers: {
            "Content-Type": "application/pdf",
            "X-Filename": file.name,
            "X-DPI": String(dpi)
          },
          body: file
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `HTTP ${response.status}`);
        }

        const result = await response.json();
        const pages = Array.isArray(result?.pages) ? result.pages : [];
        if (pages.length === 0) {
          throw new Error("Proxy returned no pages");
        }

        const jpgFiles = pages.map((page) => base64ToFile(page.data, page.name, "image/jpeg"));
        await appendFilesToImageInput(jpgFiles);

        setPdfStatus(`Added ${jpgFiles.length} page${jpgFiles.length === 1 ? "" : "s"} from ${file.name} (at ${dpi} DPI)`);
        console.log("[ephyprompt]", "PDF rasterized", { filename: file.name, pageCount: jpgFiles.length });
      } catch (error) {
        console.log("[ephyprompt]", "PDF rasterization failed", { error: error.message });
        setPdfStatus(`Failed to rasterize ${file.name}: ${error.message}`);
        alert(`Failed to rasterize PDF: ${error.message}`);
      } finally {
        elements.pdf.value = "";
        elements.pdf.disabled = false;
        elements.send.disabled = false;
      }
    }

    function setSendButtonReceiving(receiving) {
      elements.send.textContent = receiving ? "Stop" : "Send";
    }

    function processSSEBuffer(buffer, processData) {
      const chunks = buffer.split("\n\n");
      const remainder = chunks.pop() || "";

      for (const chunk of chunks) {
        let dataLine = "";
        for (const line of chunk.split("\n")) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          if (trimmed.startsWith("data:")) dataLine = trimmed.slice(5).trim();
        }

        if (!dataLine) continue;
        if (dataLine === "[DONE]") {
          console.log("[ephyprompt]", "Stream finished");
          continue;
        }

        try {
          processData(JSON.parse(dataLine));
        } catch (error) {
          console.log("[ephyprompt]", "Failed to parse SSE payload", { dataLine, error: error.message });
        }
      }

      return remainder;
    }

    async function send(event) {
      event?.preventDefault();
      if (activeRequest) {
        activeRequest.abort();
        return;
      }

      const text = elements.input.value.trim();
      const model = elements.model.value;
      const imageFiles = Array.from(elements.image.files || []);
      const modelConfig = MODEL_OPTIONS.find((entry) => entry.id === model);

      if (imageFiles.length > 0 && !modelConfig?.supportsImages) {
        alert("The selected model does not support image uploads.");
        return;
      }

      const content = [];
      if (text) content.push({ type: "text", text });

      for (const image of imageFiles) {
        content.push({
          type: "text",
          text: `Filename: ${image.name}`
        });
        content.push({
          type: "image_url",
          image_url: { url: await fileToBase64(image) }
        });
      }

      clearSelectedImages();
      messages.push({ role: "user", content });
      createUserBubble(content);

      console.log("[ephyprompt]", "Sending chat request", { model, messageCount: messages.length, imageCount: imageFiles.length, stream: true });

      const assistantBubble = createAssistantBubble();

      let response;
      activeRequest = new AbortController();
      setSendButtonReceiving(true);
      try {
        response = await fetch("/chat", {
          method: "POST",
          signal: activeRequest.signal,
          headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
          body: JSON.stringify({
            model,
            messages: messages,
            stream: true,
            chat_template_kwargs: { enable_thinking: elements.thinking.checked, thinking: elements.thinking.checked }
          })
        });
      } catch (error) {
        if (error.name === "AbortError") {
          updateAssistantBubble(assistantBubble, { content: "(stopped)", thinking: false, loading: false });
        } else {
          updateAssistantBubble(assistantBubble, { content: `ERROR: ${error.message}`, thinking: false, loading: false });
        }
        activeRequest = null;
        setSendButtonReceiving(false);
        return;
      }

      console.log("[ephyprompt]", "Received response", { status: response.status, ok: response.ok, contentType: response.headers.get("content-type") });

      if (!response.ok) {
        const errorText = await response.text();
        console.log("[ephyprompt]", "Request failed", { status: response.status, body: errorText });
        updateAssistantBubble(assistantBubble, { content: `ERROR: ${errorText}`, thinking: false, loading: false });
        activeRequest = null;
        setSendButtonReceiving(false);
        return;
      }

      const reader = response.body?.getReader();
      if (!reader) {
        updateAssistantBubble(assistantBubble, { content: "ERROR: response body is not readable", thinking: false, loading: false });
        activeRequest = null;
        setSendButtonReceiving(false);
        return;
      }

      const decoder = new TextDecoder();
      let assistantText = "";
      let assistantThinking = "";
      let sseBuffer = "";

      function processReceived(data) {
        const delta = data.choices?.[0]?.delta;
        if (delta?.content) assistantText += delta.content;
        const thinkingDelta = delta?.reasoning_content ?? delta?.reasoning;
        if (thinkingDelta) assistantThinking += thinkingDelta;
        updateAssistantBubble(assistantBubble, { content: assistantText, thinking: assistantThinking, loading: true });
      }

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          sseBuffer = processSSEBuffer(sseBuffer + decoder.decode(value, { stream: true }), processReceived);
        }
        processSSEBuffer(sseBuffer + decoder.decode(), processReceived);
      } catch (error) {
        if (error.name === "AbortError") {
          updateAssistantBubble(assistantBubble, { content: "(aborted)", thinking: false, loading: false });
        } else {
          throw error;
        }
      } finally {
        activeRequest = null;
        setSendButtonReceiving(false);
      }

      const reply = assistantText || "(no response)";
      updateAssistantBubble(assistantBubble, { content: reply, thinking: assistantThinking, loading: false });
      messages.push({ role: "assistant", content: reply });
      elements.input.value = "";
      console.log("[ephyprompt]", "Chat response completed");
    }

    document.addEventListener("DOMContentLoaded", () => {
      console.log("[ephyprompt]", "loading, elements.imnages still contains how many files?", elements.image.files.length);
      clearSelectedImages(); // clear browser trying to restore upload (firefox)

      populateModelOptions();
      elements.model.addEventListener("change", updateImageControls);
      elements.image.addEventListener("change", updateImageSelectionSummary);
      elements.pdf.addEventListener("change", handlePdfSelected);
      elements.composer.addEventListener("submit", send);
      elements.input.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          if (!activeRequest && !elements.send.disabled) {
            send(event);
          }
        }
      });
    });
  </script>
</body>

</html>
