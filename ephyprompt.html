<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EphyPrompt</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <aside class="sidebar">
    <div class="banner">
      EphyPrompt<br />
      such private, very security, wow
    </div>

    <label class="field">
      <span>Model</span>
      <select id="model"></select>
      <div id="model-info" class="leftbar-status-helper"></div>
    </label>

    <label class="checkbox">
      <input type="checkbox" id="thinking" checked />
      <span>Thinking</span>
    </label>

    <label class="field">
      <span>Text-like Documents (allows selecting multiple)</span>
      <input type="file" id="text-attachments" accept="text/plain, text/csv, text/markdown, text/json, .txt, .csv, .md, .json, .html, .css, .py, .js" multiple />
      <div id="text-selection" class="leftbar-status-helper" hidden></div>
    </label>

    <label class="field">
      <span>Images (allows selecting multiple)</span>
      <input type="file" id="image-attachments" accept="image/*" multiple />
      <div id="image-selection" class="leftbar-status-helper" hidden></div>
    </label>

    <label class="field">
      <span>PDF (rasterized and attached as images)</span>
      <input type="file" id="pdf-attachments" accept="application/pdf" />
      <div id="pdf-status" class="leftbar-status-helper pdf-status" hidden></div>
    </label>

    <div class="leftbar-status-helper">
      PDF rasterization width (px):
      <input type="text" id="pdf-width" value="640" autocomplete="off" />
    </div>
  </aside>

  <main class="chat">
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="composer" class="composer">
      <textarea id="input" placeholder="Was geht bei dir so, digga?">Was geht bei dir so, digga?</textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>
  <script src="/startup-config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
