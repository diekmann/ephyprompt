<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EphyPrompt</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <aside class="sidebar">
    <div class="banner">
      EphyPrompt<br />
      such private, very security, wow
    </div>

    <label class="field">
      <span>Model</span>
      <select id="model"></select>
      <div id="model-info" class="image-selection-list"></div>
    </label>

    <label class="checkbox">
      <input type="checkbox" id="thinking" checked />
      <span>Thinking</span>
    </label>

    <label class="field">
      <span>Images (allows selecting multiple)</span>
      <input type="file" id="image" accept="image/*" multiple />
      <div id="image-selection" class="image-selection-list" hidden></div>
    </label>

    <label class="field">
      <span>PDF (rasterized and attached as images)</span>
      <input type="file" id="pdf" accept="application/pdf" />
      <div id="pdf-status" class="image-selection-list pdf-status" hidden></div>
    </label>

    <label class="field">
      <span>PDF rasterization DPI</span>
      <select id="pdf-dpi">
        <option value="72">72 (default, small)</option>
        <option value="100">100</option>
        <option value="150">150 (medium)</option>
        <option value="200">200</option>
        <option value="300">300 (high)</option>
      </select>
    </label>
  </aside>

  <main class="chat">
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="composer" class="composer">
      <textarea id="input" placeholder="Was geht bei dir so, digga?">Was geht bei dir so, digga?</textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>
  <script src="app.js" defer></script>
</body>

</html>
